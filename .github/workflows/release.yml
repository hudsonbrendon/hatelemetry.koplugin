name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p "dist/hatelemetry.koplugin"
          cp *.lua "dist/hatelemetry.koplugin/"
          cp README.md logo.png "dist/hatelemetry.koplugin/" 2>/dev/null || true
          ( cd dist && zip -r "../hatelemetry.koplugin-${GITHUB_REF_NAME}.zip" "hatelemetry.koplugin" )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: hatelemetry.koplugin-*.zip
          generate_release_notes: true
